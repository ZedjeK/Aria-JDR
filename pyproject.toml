[project]
name = "aria-jdr"
version = "0.1.0"
description = "Moteur de JDR solo avec un MJ LLM local, sur un socle de règles d100 multi-univers."
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.129", "uvicorn>=0.41"]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.28.1"]
# Pour construire l'exe portable (build.ps1).
exe = ["pyinstaller==6.22.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Seules les fonctions « test_… » sont des tests (pas la fonction `tester` du moteur).
python_functions = ["test_*"]
