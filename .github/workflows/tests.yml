# Tests du moteur (pytest) à chaque push et à chaque pull request.
# Aucun modèle ni llama-server : les tests ne touchent qu'au moteur et à des faux (monkeypatch, tmp_path).
#
# Linux suffit : le code propre à Windows est déjà gardé (sys.platform pour la RAM, CREATE_NO_WINDOW
# lu avec getattr, nvidia-smi cherché avec shutil.which) et les chemins passent par pathlib.
# Les chemins .venv\Scripts ne figurent que dans les messages et la doc.

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # La version minimale (requires-python) et la dernière stable
        python: ["3.11", "3.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Le projet n'est pas installable tel quel (pas de section de build : « pip install .[dev] »
      # échoue sur la découverte des paquets) : pytest seul, comme dans les extras dev.
      - name: Installer pytest
        run: python -m pip install "pytest>=9"

      - name: Lancer les tests
        run: python -m pytest
